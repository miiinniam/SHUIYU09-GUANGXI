<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>广西水鱼</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #07130f;
      --panel: #101f19;
      --panel-2: #142820;
      --line: rgba(224, 183, 96, 0.18);
      --gold: #d7ad58;
      --gold-2: #f0d28a;
      --text: #f6f0e3;
      --muted: rgba(246, 240, 227, 0.58);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-top: env(safe-area-inset-top);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #050b09;
      overflow: hidden;
      user-select: none;
      -webkit-text-size-adjust: 100%;
    }
    #page-home {
      background-image: url('assets/shuiyu-home.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    #page-home .topbar {
      padding: max(18px, calc(env(safe-area-inset-top) + 10px)) 18px 18px;
      margin-bottom: 0;
      background: linear-gradient(180deg, rgba(7,19,15,0.55) 0%, rgba(7,19,15,0) 100%);
      position: relative;
      z-index: 2;
    }
    #page-home .topbar .eyebrow,
    #page-home .topbar .player-name {
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    #page-home .topbar .pill {
      background: rgba(7,19,15,0.42);
      border-color: rgba(215,173,88,0.32);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    #page-home .hero { display: none; }
    #page-home .form-panel {
      margin: auto 14px 0;
      padding: 18px;
      background: linear-gradient(180deg, rgba(7,19,15,0.55), rgba(7,19,15,0.82));
      backdrop-filter: blur(20px) saturate(1.2);
      -webkit-backdrop-filter: blur(20px) saturate(1.2);
      border: 1px solid rgba(215,173,88,0.34);
      box-shadow: 0 -14px 60px rgba(7,19,15,0.55), 0 18px 42px rgba(0,0,0,0.45);
    }
    #page-home .form-panel .field {
      background: rgba(0,0,0,0.42);
      border-color: rgba(215,173,88,0.22);
    }
    #page-home .note {
      margin: 12px 18px max(16px, calc(10px + var(--safe-bottom)));
      text-shadow: 0 1px 4px rgba(0,0,0,0.75);
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .hidden { display: none !important; }
    .page {
      width: min(100%, 460px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(22px, calc(var(--safe-top) + 14px)) 18px max(22px, calc(18px + var(--safe-bottom)));
      position: relative;
    }
    @media (max-width: 380px) {
      .page { padding-left: 14px; padding-right: 14px; }
      .row { grid-template-columns: 1fr 96px; }
    }
    @media (max-width: 340px) {
      .field { height: 50px; padding: 0 14px; }
      .primary-btn, .secondary-btn, .ghost-btn { height: 50px; }
      #in-room { font-size: 22px; }
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
    }
    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #17120a;
      font-weight: 900;
      background: linear-gradient(145deg, var(--gold-2), #b37a28);
      box-shadow: 0 10px 28px rgba(215, 173, 88, 0.22);
      flex: none;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .player-name {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hero { margin-bottom: 30px; }
    .title {
      margin: 0;
      font-size: clamp(50px, 15vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 950;
    }
    .subtitle {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .panel {
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.065), rgba(255,255,255,0.035));
      border: 1px solid var(--line);
      box-shadow: 0 18px 42px rgba(0,0,0,0.24);
    }
    .form-panel { padding: 16px; }
    .field-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin: 0 0 8px 4px;
    }
    .field {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 0 16px;
      color: var(--text);
      background: rgba(0,0,0,0.22);
      outline: none;
    }
    .field:focus {
      border-color: rgba(215,173,88,0.68);
      box-shadow: 0 0 0 4px rgba(215,173,88,0.12);
    }
    #in-room {
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.28em;
      padding-left: calc(16px + 0.28em);
    }
    .stack { display: grid; gap: 14px; }
    .row { display: grid; grid-template-columns: 1fr 108px; gap: 10px; }
    .primary-btn, .secondary-btn, .ghost-btn {
      height: 54px;
      border-radius: 18px;
      font-weight: 900;
      transition: transform .14s ease, opacity .14s ease, filter .14s ease;
    }
    .primary-btn:active, .secondary-btn:active, .ghost-btn:active { transform: scale(0.98); }
    .primary-btn {
      color: #17120a;
      background: linear-gradient(135deg, #f4d98d, #c79237);
      box-shadow: 0 14px 32px rgba(199,146,55,0.24);
    }
    .secondary-btn {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid rgba(215,173,88,0.24);
    }
    .ghost-btn {
      color: var(--text);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .note {
      margin-top: 14px;
      color: rgba(246,240,227,0.42);
      font-size: 12px;
      text-align: center;
    }
    .setting-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      color: var(--text);
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 24px;
    }
    .room-card {
      padding: 26px 18px;
      text-align: center;
      margin-bottom: 16px;
    }
    .room-no {
      margin-top: 6px;
      color: var(--gold-2);
      font-size: 54px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0.18em;
      padding-left: 0.18em;
    }
    .setting-card {
      padding: 18px;
      margin-bottom: 16px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .setting-title { font-size: 16px; font-weight: 900; }
    .setting-desc { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex: none;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.08);
      transition: .18s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 2px;
      top: 2px;
      border-radius: 999px;
      background: #fff;
      transition: .18s;
    }
    .switch input:checked + .slider {
      background: var(--gold);
      border-color: var(--gold);
    }
    .switch input:checked + .slider::before { transform: translateX(22px); }
    .bottom-action {
      position: fixed;
      left: 50%;
      bottom: max(16px, var(--safe-bottom));
      width: min(424px, calc(100% - 36px));
      transform: translateX(-50%);
      z-index: 20;
    }
    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      max-width: calc(100% - 48px);
      padding: 12px 16px;
      border-radius: 14px;
      color: var(--text);
      background: rgba(0,0,0,0.86);
      font-weight: 800;
      text-align: center;
    }
    .toast-anim { animation: fadeInOut 2s ease-in-out forwards; }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.62);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.22);
      border-top-color: var(--gold);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -46%) scale(.96); }
      15%, 85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -54%) scale(.98); }
    }
  </style>
</head>
<body>

  <main id="page-home" class="page">
    <header class="topbar">
      <div class="brand-mini">
        <div class="mark">水</div>
        <div>
          <div class="eyebrow">广西水鱼</div>
          <div id="home-player-name" class="player-name">玩家</div>
        </div>
      </div>
      <div class="pill">酒 <strong style="color:var(--gold-2)">0</strong></div>
    </header>

    <section class="hero">
      <h1 class="title">水鱼</h1>
      <p class="subtitle">开房间、发牌、配头尾牌。界面只保留实战需要的操作。</p>
    </section>

    <section class="panel form-panel stack">
      <div>
        <label class="field-label" for="in-name">昵称</label>
        <input id="in-name" class="field" type="text" placeholder="请输入昵称" maxlength="10">
      </div>
      <div>
        <label class="field-label" for="in-room">加入房间</label>
        <div class="row">
          <input id="in-room" class="field" type="text" placeholder="0000" maxlength="4" inputmode="numeric">
          <button id="btn-join" onclick="handleJoin()" class="secondary-btn">加入</button>
        </div>
      </div>
      <button id="btn-create" onclick="handleCreate()" class="primary-btn">创建房间</button>
    </section>

    <div class="note">三台设备连接同一个 Wi-Fi 后，使用同一个房间号进入。</div>
  </main>

  <main id="page-setting" class="page hidden">
    <header class="setting-head">
      <button onclick="backHome()" class="icon-btn">‹</button>
      <div class="setting-title">创建房间</div>
      <button onclick="shareRoom()" class="ghost-btn" style="width:64px;height:42px;border-radius:14px">分享</button>
    </header>

    <section class="panel room-card">
      <div class="eyebrow">房间号</div>
      <div id="disp-room" class="room-no">----</div>
    </section>

    <section class="panel setting-card">
      <div class="setting-row">
        <div>
          <div class="setting-title">变牌模式</div>
          <div class="setting-desc">开启后，大小王和花牌可参与配保。</div>
        </div>
        <label class="switch">
          <input id="in-variant" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="panel setting-card">
      <div class="setting-title">当前功能</div>
      <div class="setting-desc">进入游戏后可发牌、洗牌、盖牌、翻牌、拖动配牌、换庄。</div>
    </section>

    <button onclick="startGame()" class="primary-btn bottom-action">进入游戏</button>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div></div>

  <script src="firebase-config.js"></script>
  <script src="game-logic.js"></script>
  <script>
    const S = {
      roomId: null, playerId: null, playerName: '玩家',
      isVariant: false, roomData: null, myData: null
    };

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      el.classList.add('toast-anim');
      setTimeout(() => { el.classList.add('hidden'); el.classList.remove('toast-anim'); }, 2000);
    }

    function loading(show_) { show_ ? show('loading') : hide('loading'); }

    function getName() {
      return document.getElementById('in-name').value.trim() || '玩家' + Math.floor(Math.random()*900+100);
    }

    async function handleCreate() {
      const name = getName();
      loading(true);

      try {
        const roomId = generateRoomId();
        const res = await createRoom(roomId, false, 8, name);
        if (res.success) {
          S.roomId = res.roomId;
          S.playerId = res.playerId;
          S.playerName = name;
          S.isVariant = false;
          document.getElementById('in-variant').checked = false;
          localStorage.setItem('shuiyu_name', name);
          document.getElementById('disp-room').textContent = res.roomId;
          hide('page-home'); show('page-setting');
        }
      } catch(e) {
        toast('创建失败: ' + e.message);
      } finally {
        loading(false);
      }
    }

    async function handleVariantChange() {
      if (!S.roomId) return;
      S.isVariant = document.getElementById('in-variant').checked;
      loading(true);
      try {
        await updateRoomVariant(S.roomId, S.isVariant);
        toast(S.isVariant ? '已开启变牌模式' : '已关闭变牌模式');
      } catch(e) {
        document.getElementById('in-variant').checked = !S.isVariant;
        S.isVariant = !S.isVariant;
        toast('模式更新失败');
      } finally {
        loading(false);
      }
    }

    async function handleJoin() {
      const code = document.getElementById('in-room').value.trim();
      const name = getName();

      if (!code || code.length !== 4) { toast('请输入4位房间号'); return; }
      loading(true);

      try {
        const res = await joinRoom(code, name);
        if (res.success) {
          S.roomId = code;
          S.playerId = res.playerId;
          S.playerName = name;
          S.isVariant = res.room.isVariant;
          S.roomData = res.room;
          localStorage.setItem('shuiyu_name', name);
          window.location.href = 'game.html?room=' + code + '&player=' + res.playerId;
        } else {
          toast(res.reason || '加入失败');
        }
      } catch(e) {
        toast('加入失败: ' + e.message);
      } finally {
        loading(false);
      }
    }

    function backHome() {
      hide('page-setting');
      show('page-home');
    }

    function shareRoom() {
      const text = '广西水鱼 - 房间号: ' + S.roomId;
      if (navigator.share) {
        navigator.share({ title: '广西水鱼', text });
      } else {
        navigator.clipboard.writeText(text);
        toast('已复制房间号');
      }
    }

    function startGame() {
      window.location.href = 'game.html?room=' + S.roomId + '&player=' + S.playerId;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('shuiyu_name');
      if (saved) document.getElementById('in-name').value = saved;
      document.getElementById('home-player-name').textContent = saved || '玩家';
      document.getElementById('in-variant').addEventListener('change', handleVariantChange);
      show('page-home');
    });
  </script>
</body>
</html>
